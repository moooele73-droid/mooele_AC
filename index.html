<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE6">
<title>米記帳</title>
<style>
:root{
  --bg:#F5EFE6; --card:#FFFBF5; --card2:#F9F3EA; --line:#E8DCCB; --line2:#DCCBB4;
  --text:#4A4038; --muted:#9A8C7D; --accent:#B08968; --accent-d:#8C6A4F;
  --inc:#6F9873; --exp:#C27660; --r:18px; --r-s:12px;
  --shadow:0 2px 10px rgba(120,95,70,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-size:20px;font-weight:700;letter-spacing:.5px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:9px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:7px;border-radius:4px;background:var(--card)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
/* iOS Safari：日期欄預設有最小寬度且置中，會超出容器 */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
.grid2>*,.field{min-width:0}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:120;background:var(--text);color:var(--bg);
  border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap}
.updbar button{border:0;border-radius:999px;padding:6px 14px;background:var(--accent);color:#fff;cursor:pointer}
header select{width:auto;min-width:0;max-width:40vw;flex:0 1 auto;padding:8px 10px}
.brand{white-space:nowrap}
nav.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:999px;border:1px solid var(--line);
  margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav.tabs button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.dan{color:var(--exp);border-color:#E7C3B7}
.btn.sm{padding:5px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum3 div{background:var(--card2);border-radius:var(--r-s);padding:10px 12px;min-width:0}
.sum3 b{display:block;font-size:clamp(15px,4.4vw,19px);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .x{opacity:.55;cursor:pointer}
.chip.add{border-style:dashed;color:var(--accent-d);background:transparent}
.addbox{display:inline-flex;gap:6px;align-items:center}
.addbox input{width:170px;padding:5px 12px;border-radius:999px}
mark{background:#F1DFC4;color:inherit;border-radius:4px;padding:0 2px}
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{padding:11px 40px 11px 40px;border-radius:999px;background:var(--card)}
#gq::-webkit-search-cancel-button{display:none}
.searchbar .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbar .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--card2);border-radius:999px;width:28px;height:28px;cursor:pointer;color:var(--muted)}
.scrollx{overflow-x:auto;scrollbar-width:thin}
.scrollx .chips{flex-wrap:nowrap}
.day{margin:14px 4px 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.rec{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-s);cursor:pointer}
.rec:hover{background:var(--card2)}
.rec+.rec{border-top:1px dashed var(--line)}
.dot{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600}
.rec .mid{flex:1;min-width:0}
.rec .mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tripnote{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.tripnote a{color:var(--accent-d);cursor:pointer;text-decoration:underline}
.tag{display:inline-block;font-size:11.5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;color:var(--muted)}
.fab{position:fixed;right:max(20px,calc(50vw - 420px));bottom:24px;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);
  color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 18px rgba(140,106,79,.35)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(74,64,56,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px;padding:0 20px 20px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mask{align-items:center}
.modal>h2:first-child{position:sticky;top:0;z-index:3;background:var(--bg);padding:18px 0 12px;display:flex;align-items:center;gap:8px}
.mclose{margin-left:auto;flex:none;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;color:var(--muted)}
.modal .actions{position:sticky;bottom:0;z-index:3;background:var(--bg);padding:12px 0 2px;margin-top:16px;border-top:1px solid var(--line)}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
/* 手機：全螢幕視窗 */
@media(max-width:639px){
  .mask{align-items:stretch;background:var(--bg);animation:slideup .2s ease-out}
  .modal{max-width:none;height:100%;max-height:none;border-radius:0;padding:0 16px}
  .modal>h2:first-child{padding:calc(14px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
  .modal .actions{padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:20px}
  input,select,textarea{font-size:16px!important}   /* 避免 iOS 點輸入框時自動放大 */
  .amtbox input{font-size:24px!important}
}
@keyframes slideup{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.modal h2{margin:0 0 6px;font-size:18px}
.field{margin-bottom:12px}
.field>label,.lbl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 4px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;cursor:pointer;color:var(--muted)}
.seg button.on.e{background:var(--exp);color:#fff}
.seg button.on.i{background:var(--inc);color:#fff}
.seg button.on.n{background:var(--accent);color:#fff}
.amtbox{display:flex;gap:8px}
.amtbox select{width:96px;flex:none}
.amtbox input{font-size:24px;font-weight:600;padding:8px 14px}
.sugg{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sugg button{text-align:left;border:1px dashed var(--line2);background:var(--card2);border-radius:var(--r-s);padding:7px 12px;cursor:pointer;font-size:13.5px}
.sugg button:hover{border-style:solid;border-color:var(--accent)}
.photo{border:1.5px dashed var(--line2);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;color:var(--muted);display:block;background:var(--card)}
.photo img{max-width:100%;max-height:220px;border-radius:var(--r-s);display:block;margin:0 auto}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.actions .l{margin-right:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.catrow{display:grid;grid-template-columns:14px 1fr auto;gap:8px 10px;align-items:center;padding:6px 0}
.catrow .sw{width:12px;height:12px;border-radius:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tbl-wrap{overflow-x:auto;max-height:420px;overflow-y:auto}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media(max-width:560px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{max-width:200px;margin:0 auto;display:block}.grid2{grid-template-columns:1fr}}
.trip .hd{display:flex;align-items:baseline;gap:8px}
.trip .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:var(--card2);padding:10px;border-radius:var(--r-s)}
.kv span:nth-child(odd){color:var(--muted)}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;background:var(--card2)}
.drop.over{border-color:var(--accent);background:#F3E8DA}
.ok{color:var(--inc)} .bad{color:var(--exp)}
.lightbox{position:fixed;inset:0;background:rgba(30,26,23,.94);z-index:80;animation:fade .15s}
.lb-stage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(56px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom));overflow:auto}
.lb-img{max-width:100%;max-height:100%;border-radius:12px;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.lb-stage.zoom{display:block;padding:calc(56px + env(safe-area-inset-top)) 0 0}
.lb-stage.zoom .lb-img{max-width:none;max-height:none;width:200%;border-radius:0;cursor:zoom-out}
.lb-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:14px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:60px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:32px;cursor:pointer}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-count{position:absolute;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:999px}
.lb-cap{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);color:var(--text);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px}
.lb-cap>div{flex:1;min-width:0}.lb-cap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-edit{border:1px solid var(--line2);background:var(--card2);border-radius:999px;padding:7px 14px;cursor:pointer;flex:none}
.thumbbox{position:relative;flex:none;cursor:zoom-in;border-radius:10px}
.thumbbox:active{transform:scale(.94)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:8px}
.pics:empty{display:none}
.pic{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.pic img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.pic button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:9px;border:0;background:rgba(74,64,56,.65);color:#fff;cursor:pointer}
.pic .mv{top:auto;bottom:4px;right:4px;left:4px;width:auto;height:24px;font-size:11.5px}
.pic span{position:absolute;left:4px;top:4px;bottom:auto!important;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px}
.pic span.x{position:absolute;left:4px;bottom:4px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px}
.thumb{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>米記帳</div>
    <select id="selYear" title="年份"></select>
    <select id="selBook" title="帳冊"></select>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="list" class="on">明細</button>
    <button data-tab="stats">統計</button>
    <button data-tab="trips">旅行</button>
    <button data-tab="import">匯入</button>
    <button data-tab="settings">設定</button>
  </nav>
  <div class="searchbar"><span class="ic">🔍</span>
    <input type="search" id="gq" placeholder="搜尋過去紀錄：備註、類別、付款方式、金額、店家…" autocomplete="off">
    <button class="clr" id="gqClr" title="清除" style="display:none">✕</button></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" title="記一筆">＋</button>

<script>
const APP_VERSION = '1.9（2026-11-17）';
/* ================= 工具 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const fmtI = n => Math.round(+n || 0).toLocaleString('zh-TW');
const fmt = (n, d = 0) => (Math.round((+n || 0) * 100) / 100).toLocaleString('zh-TW', {minimumFractionDigits: d, maximumFractionDigits: 2});
const base = r => (+r.amount || 0) * (+r.rate || 1);
const signed = r => r.type === 'income' ? base(r) : -base(r);
function toast(msg) {
  $$('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
const PALETTE = ['#B08968','#C27660','#6F9873','#D4A373','#8C7AA9','#6B93B8','#D99A8A','#A3B18A','#9C6644','#C9A66B','#8D99AE','#B5838D','#7F9C96','#CB997E'];
function colorOf(name) {
  const cats = [...S.settings.expenseCats, ...S.settings.incomeCats];
  let i = cats.indexOf(name);
  if (i < 0) { i = 0; for (const ch of String(name)) i = (i * 31 + ch.charCodeAt(0)) >>> 0; }
  return PALETTE[i % PALETTE.length];
}
const CURRENCIES = ['TWD','JPY','USD','EUR','KRW','CNY','HKD','THB','GBP','AUD','SGD','VND','MYR','PHP','CAD','NZD','CHF','IDR'];

/* ================= IndexedDB ================= */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('mi-ledger', 1);
    r.onupgradeneeded = () => ['records','books','trips','meta'].forEach(s => {
      if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, {keyPath: 'id'});
    });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (store, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(store, mode); const os = t.objectStore(store); const out = fn(os);
  t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error);
});
const getAll = s => tx(s, 'readonly', os => os.getAll());
const put = (s, o) => tx(s, 'readwrite', os => { os.put(o); });
const putMany = (s, arr) => tx(s, 'readwrite', os => { arr.forEach(o => os.put(o)); });
const del = (s, id) => tx(s, 'readwrite', os => { os.delete(id); });
const delMany = (s, ids) => tx(s, 'readwrite', os => { ids.forEach(id => os.delete(id)); });
const clearStore = s => tx(s, 'readwrite', os => { os.clear(); });

/* ================= 狀態 ================= */
const DEFAULT_SETTINGS = {
  id: 'settings', baseCur: 'TWD',
  expenseCats: ['餐飲','交通','購物','日用','居家','娛樂','醫療','教育','旅行','人情','其他'],
  incomeCats: ['薪資','獎金','投資','兼職','退款','其他收入'],
  payments: ['現金','信用卡','金融卡','行動支付','轉帳'],
  rates: {JPY: 0.21, USD: 32, EUR: 35, KRW: 0.023, CNY: 4.4, HKD: 4.1, THB: 0.9}
};
const S = {records: [], books: [], trips: [], settings: null,
  ui: {tab: 'list', year: new Date().getFullYear(), bookId: 'all', month: 0, q: '', statType: 'expense', unit: 'month', incTrips: false}};

async function load() {
  db = await openDB();
  [S.records, S.books, S.trips] = await Promise.all(['records','books','trips'].map(getAll));
  const meta = await getAll('meta');
  S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), meta.find(m => m.id === 'settings') || {});
  if (!S.books.length) await ensureBook(new Date().getFullYear());
  try { Object.assign(S.ui, JSON.parse(localStorage.getItem('mi-ui') || '{}'), {q: ''}); } catch (e) {}
}
const saveSettings = () => put('meta', S.settings);
const saveUI = () => { try { localStorage.setItem('mi-ui', JSON.stringify({tab: S.ui.tab, year: S.ui.year, bookId: S.ui.bookId, statType: S.ui.statType, unit: S.ui.unit, incTrips: S.ui.incTrips})); } catch (e) {} };

async function ensureBook(year, name) {
  year = +year;
  let b = name ? S.books.find(b => b.name === name && +b.year === year) : S.books.find(b => +b.year === year);
  if (!b) {
    b = {id: uid(), name: name || `${year} 日常帳`, year, createdAt: Date.now()};
    S.books.push(b); await put('books', b);
  }
  return b;
}
const bookName = id => (S.books.find(b => b.id === id) || {}).name || '（未知帳冊）';
const tripOf = id => S.trips.find(t => t.id === id);

function years() {
  const ys = new Set([new Date().getFullYear(), ...S.books.map(b => +b.year), ...S.records.map(r => +r.date.slice(0, 4))]);
  return [...ys].filter(Boolean).sort((a, b) => b - a);
}
function scoped({ignoreMonth = false} = {}) {
  const {year, bookId, month} = S.ui;
  return S.records.filter(r => +r.date.slice(0, 4) === +year
    && (bookId === 'all' || r.bookId === bookId)
    && (ignoreMonth || !month || +r.date.slice(5, 7) === month));
}

/* ================= Header / 導覽 ================= */
function renderHeader() {
  const ys = years();
  if (!ys.includes(+S.ui.year)) S.ui.year = ys[0];
  $('#selYear').innerHTML = ys.map(y => `<option value="${y}" ${+y === +S.ui.year ? 'selected' : ''}>${y} 年</option>`).join('');
  const bs = S.books.filter(b => +b.year === +S.ui.year);

function showGallery(list, idx = 0, rec = null) {
  const l = document.createElement('div'); l.className = 'lightbox';

  l.innerHTML = `<div class="lb-stage"><img class="lb-img" alt=""></div>

    ${list.length > 1 ? `<button class="lb-nav lb-prev" title="上一張">‹</button><button class="lb-nav lb-next" title="下一張">›</button><div class="lb-count"></div>` : ''}${cap}`;
  const img = $('.lb-img', l), stage = $('.lb-stage', l);
  const show = () => { img.src = list[idx]; stage.classList.remove('zoom'); const c = $('.lb-count', l); if (c) c.textContent = `${idx + 1} / ${list.length}`; };
  const go = d => { idx = (idx + d + list.length) % list.length; show(); };
  const close = () => { l.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
  document.addEventListener('keydown', key);
  l.onclick = e => {
    const t = e.target;
    if (t.classList.contains('lb-prev')) return go(-1);
    if (t.classList.contains('lb-next')) return go(1);
    if (t.classList.contains('lb-edit')) { close(); return openRecordForm(rec); }
    if (t === img) { if (!moved) stage.classList.toggle('zoom'); return; }
    if (t.closest('.lb-cap')) return;
    close();
  };
  let x0 = null, y0 = null, moved = false;
  l.addEventListener('touchstart', e => { if (stage.classList.contains('zoom')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, {passive: true});
  l.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;

}

function compressImage(file, max = 1400, q = .82) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* 相似紀錄建議：依備註關鍵字比對，合併相同組合，依相似度 × 次數 × 新近度排序 */
function bigrams(s) { s = s.toLowerCase().replace(/\s+/g, ''); const out = new Set(); for (let i = 0; i < s.length - 1; i++) out.add(s.slice(i, i + 2)); if (s.length === 1) out.add(s); return out; }
function suggestions(q, type) {
  q = (q || '').trim().toLowerCase();
  const groups = new Map();
  const qb = bigrams(q);
  for (const r of S.records) {
    if (!r.note || r.type !== type) continue;
    const n = r.note.toLowerCase();
    let score;
    if (!q) score = 1;
    else if (n === q) score = 0;           // 完全相同不必再建議
    else if (n.includes(q)) score = 10 + (q.length / n.length) * 5;
    else if (q.includes(n) && n.length >= 2) score = 8;
    else { const nb = bigrams(n); let hit = 0; qb.forEach(b => nb.has(b) && hit++); score = hit ? hit / Math.max(qb.size, 1) * 6 : 0; }
    if (score <= 0) continue;
    const key = [r.note, r.category, r.payment, r.amount, r.currency].join('|');
    const g = groups.get(key) || {r, score, count: 0, last: ''};
    g.count++; if (r.date > g.last) { g.last = r.date; g.r = r; }
    groups.set(key, g);
  }
  return [...groups.values()]
    .map(g => ({...g, rank: g.score * 3 + Math.log2(g.count + 1) * 2 + (g.last.slice(0, 4) >= String(new Date().getFullYear() - 1) ? 1 : 0)}))
    .sort((a, b) => b.rank - a.rank).slice(0, 5);
}

/* ================= 圖表 ================= */
function donutSVG(items, centerTop, centerBottom) {
  const total = items.reduce((s, x) => s + x.value, 0);
  const R = 90, r = 58, cx = 100, cy = 100;
  let a0 = -Math.PI / 2, paths = '';
  if (total > 0) items.forEach(it => {
    const frac = it.value / total; if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2 - (frac < 1 ? 0.012 : 0.0001);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, ang) => `${cx + rad * Math.cos(ang)},${cy + rad * Math.sin(ang)}`;
    paths += `<path d="M${p(R, a0)} A${R},${R} 0 ${large} 1 ${p(R, a1)} L${p(r, a1)} A${r},${r} 0 ${large} 0 ${p(r, a0)} Z" fill="${it.color}"><title>${esc(it.label)} ${fmt(it.value)}</title></path>`;
    a0 += frac * Math.PI * 2;
  });
  else paths = `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="#EFE5D7" stroke-width="${R - r}"/>`;
  return `<svg viewBox="0 0 200 200" width="100%">${paths}
    <text x="100" y="94" text-anchor="middle" font-size="12" fill="#9A8C7D">${esc(centerTop)}</text>
    <text x="100" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#4A4038">${esc(centerBottom)}</text></svg>`;
}
function barsSVG(periods) {
  const n = periods.length; if (!n) return '';
  const max = Math.max(1, ...periods.map(p => Math.max(p.inc, p.exp)));
  const minNet = Math.min(0, ...periods.map(p => p.inc - p.exp));
  const slot = Math.max(34, Math.min(70, 640 / n)), W = Math.max(640, slot * n + 50), H = 230, top = 14, bottom = 34, left = 44;
  const ph = H - top - bottom;
  const y = v => top + ph - (v / max) * ph;
  const bw = Math.min(14, slot / 3.2);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, yy = y(v);
    g += `<line x1="${left}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#EFE5D7"/><text x="${left - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#9A8C7D">${v >= 10000 ? fmt(v / 10000) + '萬' : fmt(Math.round(v))}</text>`;
  }
  let line = '';
  periods.forEach((p, i) => {
    const x = left + i * slot + slot / 2;
    g += `<rect x="${x - bw - 1}" y="${y(p.inc)}" width="${bw}" height="${Math.max(0, y(0) - y(p.inc))}" rx="4" fill="#6F9873"><title>${esc(p.label)} 收入 ${fmt(p.inc)}</title></rect>
          <rect x="${x + 1}" y="${y(p.exp)}" width="${bw}" height="${Math.max(0, y(0) - y(p.exp))}" rx="4" fill="#C27660"><title>${esc(p.label)} 支出 ${fmt(p.exp)}</title></rect>`;
    if (n <= 40 || i % Math.ceil(n / 30) === 0) g += `<text x="${x}" y="${H - bottom + 16}" text-anchor="middle" font-size="10.5" fill="#9A8C7D">${esc(p.short || p.label)}</text>`;
    const net = p.inc - p.exp, ny = Math.min(H - bottom, Math.max(top, y(Math.max(net, 0))));
    line += `${i ? 'L' : 'M'}${x},${net >= 0 ? ny : y(0)}`;
  });
  return `<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:100%">${g}
    <path d="${line}" fill="none" stroke="#B08968" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/></svg></div>
    <div class="row small muted" style="gap:14px;margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#6F9873"></i> 收入</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#C27660"></i> 支出</span><span style="color:#B08968">┅ 損益（僅顯示正值）</span>${minNet < 0 ? '' : ''}</div>`;
}

/* ================= 統計 ================= */
function periodKey(date, unit) {
  const [y, mo, d] = date.split('-').map(Number);
  if (unit === 'day') return {k: date, label: date, short: `${mo}/${d}`};
  if (unit === 'week') {
    const dt = new Date(y, mo - 1, d); const wd = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - wd);
    const s = ymd(dt); return {k: s, label: `${s} 起`, short: `${dt.getMonth() + 1}/${dt.getDate()}`};
  }
  if (unit === 'month') return {k: `${y}-${pad(mo)}`, label: `${y}-${pad(mo)}`, short: `${mo}月`};
  if (unit === 'quarter') { const q = Math.ceil(mo / 3); return {k: `${y}-Q${q}`, label: `${y} Q${q}`, short: `Q${q}`}; }
  return {k: String(y), label: `${y} 年`, short: String(y)};
}

    </div>

function tripStats(t) {
  const rs = S.records.filter(r => r.tripId === t.id);
  const toTrip = r => r.currency === t.currency ? +r.amount : base(r) / (+t.rate || 1);
  const exp = rs.filter(r => r.type !== 'income');
  const spent = exp.reduce((s, r) => s + toTrip(r), 0);
  const spentBase = exp.reduce((s, r) => s + base(r), 0);
  const refund = rs.filter(r => r.type === 'income').reduce((s, r) => s + toTrip(r), 0);
  const byCat = {}; exp.forEach(r => byCat[r.category] = (byCat[r.category] || 0) + toTrip(r));
  const byCur = {}; exp.forEach(r => byCur[r.currency] = (byCur[r.currency] || 0) + (+r.amount));
  const days = t.start && t.end ? Math.max(1, Math.round((new Date(t.end) - new Date(t.start)) / 864e5) + 1) : 0;
  return {rs, spent, spentBase, refund, byCat, byCur, days};
}

    else if (ch === '"' && f === '') q = true;

function autoMap(headers) {

    const hn = String(h).trim().toLowerCase().replace(/\s+/g, '');

    FIELDS.forEach(([key, , syn]) => {
      let sc = 0;
      for (const s of syn) { const sn = s.toLowerCase(); if (hn === sn) sc = Math.max(sc, 3); else if (sn.length >= 2 && hn.includes(sn)) sc = Math.max(sc, 1 + sn.length / 20); }

}

  box.onclick = async e => {
    const sh = e.target.closest('[data-sheet]');
    if (sh) { const s = IMP.sheets[+sh.dataset.sheet]; IMP._sheetRows = s.rows; setRows(s.rows, s.name); return; }
    if (e.target.id === 'asTrip') { IMP.opts.trip = '__new'; renderImportStep(); $('#oCur')?.focus(); return; }
    if (e.target.id === 'catSuggest') { newCats.forEach(c => { const t = suggestCat(c.name, c.type); if (t) IMP.catMap[c.type + '|' + c.name] = t; }); return renderImportStep(); }
    if (e.target.id === 'catKeep') { IMP.catMap = {}; return renderImportStep(); }
    if (e.target.id === 'impReset') { IMP.rows = null; IMP.name = ''; render(); }
    if (e.target.id === 'dlBad') download(`無法解析_${IMP.name}.csv`, toCSV([headers, ...bad.map(b => b.row)]), 'text/csv');
    if (e.target.id === 'impGo') await doImport(IMP.opts.dedupe ? ok.filter(b => !dups.includes(b)) : ok);
  };
}
async function doImport(items) {
  const st = S.settings, o = IMP.opts; const newRecs = []; const now = Date.now();
  const fRate = parseFloat(o.rate);
  if (o.currency && o.currency !== st.baseCur && fRate > 0) st.rates[o.currency] = fRate;
  let tripId = '';
  if (o.trip === '__new') {
    const ds = items.map(b => b.rec.date).sort();
    const t = {id: uid(), name: (o.tripName || '匯入的旅行').trim(), currency: o.currency || st.baseCur, rate: o.currency && o.currency !== st.baseCur ? (fRate || 1) : 1,
      budget: 0, start: ds[0] || today(), end: ds[ds.length - 1] || today()};
    await put('trips', t); S.trips.push(t); tripId = t.id;
  } else if (o.trip) tripId = o.trip;
  for (const [i, b] of items.entries()) {
    const r = b.rec, y = +r.date.slice(0, 4);
    let book;
    if (IMP.opts.bookMode === 'auto') book = await ensureBook(y);
    else if (IMP.opts.bookMode === 'col') book = await ensureBook(y, r.bookName || undefined);
    else book = S.books.find(x => x.id === IMP.opts.bookMode);
    const list = r.type === 'income' ? st.incomeCats : st.expenseCats;
    if (!list.includes(r.category)) list.push(r.category);
    if (r.payment && !st.payments.includes(r.payment)) st.payments.push(r.payment);
    const rate = r.currency === st.baseCur ? 1 : (r.currency === o.currency && fRate > 0 ? fRate : (st.rates[r.currency] || 1));
    if (r.currency !== st.baseCur && !st.rates[r.currency]) r.extra['匯率'] = '未知，暫以 1 計算';
    if (r.bookName && IMP.opts.bookMode !== 'col') r.extra['原帳冊'] = r.bookName;
    newRecs.push({id: uid(), bookId: book.id, type: r.type, amount: r.amount, currency: r.currency, rate, category: r.category,
      date: r.date, payment: r.payment, note: r.note, photo: null, tripId, extra: r.extra,
      source: IMP.name, createdAt: now + i, updatedAt: now});
  }
  await putMany('records', newRecs); await saveSettings();
  S.records.push(...newRecs);
  const ys = [...new Set(newRecs.map(r => +r.date.slice(0, 4)))].sort();
  IMP.rows = null; IMP.name = '';
  S.ui.tab = 'list'; S.ui.year = ys[ys.length - 1] || S.ui.year; S.ui.bookId = 'all'; S.ui.month = 0;
  render(); toast(`已匯入 ${newRecs.length} 筆（${ys.join('、')}）${tripId ? '，並歸入旅行' : ''}`);
}

/* ================= 備份 / 匯出 ================= */
function download(name, content, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const toCSV = rows => '﻿' + rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n\r]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c; }).join(',')).join('\r\n');
function exportCSV() {
  const extraKeys = [...new Set(S.records.flatMap(r => Object.keys(r.extra || {})))];
  const rows = [['日期', '收支', '金額', '幣別', '匯率', `金額(${S.settings.baseCur})`, '類別', '付款方式', '備註', '帳冊', '旅行', ...extraKeys]];
  [...S.records].sort((a, b) => a.date.localeCompare(b.date)).forEach(r => rows.push([r.date, r.type === 'income' ? '收入' : '支出', r.amount, r.currency, r.rate, base(r), r.category, r.payment, r.note, bookName(r.bookId), (tripOf(r.tripId) || {}).name || '', ...extraKeys.map(k => (r.extra || {})[k] ?? '')]));
  download(`米記帳_${today()}.csv`, toCSV(rows), 'text/csv');
}
function exportBackup() {
  download(`米記帳備份_${today()}.json`, JSON.stringify({app: 'mi-ledger', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, books: S.books, trips: S.trips, records: S.records}), 'application/json');
}
async function restoreBackup(data) {
  const mode = confirm(`備份檔含 ${data.records.length} 筆紀錄、${data.books.length} 本帳冊、${(data.trips || []).length} 趟旅行。\n\n按「確定」= 合併（相同 ID 會覆蓋）\n按「取消」= 不匯入`);
  if (!mode) return;
  await putMany('books', data.books); await putMany('trips', data.trips || []); await putMany('records', data.records);
  const merge = (a, b) => { const m = new Map(a.map(x => [x.id, x])); b.forEach(x => m.set(x.id, x)); return [...m.values()]; };
  S.books = merge(S.books, data.books); S.trips = merge(S.trips, data.trips || []); S.records = merge(S.records, data.records);
  if (data.settings) {
    const s = data.settings;
    ['expenseCats', 'incomeCats', 'payments'].forEach(k => S.settings[k] = [...new Set([...S.settings[k], ...(s[k] || [])])]);
    S.settings.rates = {...s.rates, ...S.settings.rates};
    await saveSettings();
  }
  toast('備份已還原'); S.ui.tab = 'list'; render();
}

/* ================= 設定 ================= */
function renderSettings(v) {
  const st = S.settings;
  const usage = S.records.reduce((s, r) => s + (r.photo ? r.photo.length : 0), 0);
  const chipList = key => `<div class="chips" data-list="${key}">${st[key].map((c, i) => `<span class="chip" style="cursor:default">${esc(c)}<span class="x" data-del="${i}">✕</span></span>`).join('')}<span class="chip" data-add="1">＋ 新增</span></div>`;
  const booksByYear = {}; S.books.forEach(b => (booksByYear[b.year] = booksByYear[b.year] || []).push(b));
  v.innerHTML = `
  <div class="card"><h3>帳冊（依年份）<button class="btn sm sp" id="bNew">＋ 新增帳冊</button></h3>
    ${Object.keys(booksByYear).sort((a, b) => b - a).map(y => `<div class="lbl" style="margin-top:8px">${y} 年</div>
      ${booksByYear[y].map(b => { const n = S.records.filter(r => r.bookId === b.id).length; return `<div class="row" style="padding:6px 4px;border-bottom:1px dashed var(--line)">
        <span style="flex:1">${esc(b.name)} <span class="small muted">${n} 筆</span></span>
        <button class="btn sm" data-bedit="${b.id}">改名／年份</button><button class="btn sm dan" data-bdel="${b.id}">刪除</button></div>`; }).join('')}`).join('')}
  </div>
  <div class="card"><h3>支出類別</h3>${chipList('expenseCats')}</div>
  <div class="card"><h3>收入類別</h3>${chipList('incomeCats')}</div>
  <div class="card"><h3>付款方式</h3>${chipList('payments')}</div>
  <div class="card"><h3>本位幣</h3>
    <div class="row"><select id="baseCur" style="width:auto">${CURRENCIES.map(c => `<option ${c === st.baseCur ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <span class="small muted">統計與總額以此幣別計算。變更後，原本以舊本位幣記錄的資料不會自動換算。</span></div></div>
  <div class="card"><h3>備份與匯出</h3>
    <div class="small muted" style="margin-bottom:10px;line-height:1.7">資料只存在這台裝置的瀏覽器裡（IndexedDB），不會上傳到 GitHub。換手機、清除瀏覽器資料前請先備份。目前共 ${S.records.length} 筆，照片約 ${(usage * 0.75 / 1048576).toFixed(1)} MB。</div>
    <div class="row"><button class="btn pri" id="bak">下載完整備份（JSON，含照片）</button><button class="btn" id="csv">匯出 CSV</button>
      <button class="btn" id="restore">從備份還原</button><input type="file" id="restoreFile" accept=".json" hidden></div>
    <div class="row" style="margin-top:14px"><button class="btn dan sm" id="wipe">清除全部資料</button><span class="small muted" style="margin-left:auto">版本 ${APP_VERSION}</span></div></div>`;
  v.onclick = async e => {
    const t = e.target;
    const list = t.closest('[data-list]');
    if (list && t.dataset.del !== undefined) {
      const key = list.dataset.list; const name = st[key][+t.dataset.del];
      if (!confirm(`移除「${name}」？（既有紀錄不受影響）`)) return;
      st[key].splice(+t.dataset.del, 1); await saveSettings(); render();
    }
    if (list && t.dataset.add) { const n = prompt('名稱：'); if (n && n.trim() && !st[list.dataset.list].includes(n.trim())) { st[list.dataset.list].push(n.trim()); await saveSettings(); render(); } }
    if (t.id === 'bNew') {
      const y = prompt('年份：', S.ui.year); if (!y || !/^\d{4}$/.test(y.trim())) return;
      const n = prompt('帳冊名稱：', `${y} 帳冊`); if (!n || !n.trim()) return;
      await ensureBook(+y, n.trim()); render();
    }
    if (t.dataset.bedit) {
      const b = S.books.find(x => x.id === t.dataset.bedit);
      const n = prompt('帳冊名稱：', b.name); if (n === null) return;
      const y = prompt('年份：', b.year); if (y === null || !/^\d{4}$/.test(y.trim())) return;
      b.name = n.trim() || b.name; b.year = +y; await put('books', b); render();
    }
    if (t.dataset.bdel) {
      const b = S.books.find(x => x.id === t.dataset.bdel); const rs = S.records.filter(r => r.bookId === b.id);
      if (S.books.length === 1) { toast('至少要保留一本帳冊'); return; }
      if (!confirm(`刪除帳冊「${b.name}」${rs.length ? `以及其中 ${rs.length} 筆紀錄` : ''}？此動作無法復原。`)) return;
      await delMany('records', rs.map(r => r.id)); await del('books', b.id);
      S.records = S.records.filter(r => r.bookId !== b.id); S.books = S.books.filter(x => x.id !== b.id); render();
    }
    if (t.id === 'bak') exportBackup();
    if (t.id === 'csv') exportCSV();
    if (t.id === 'restore') $('#restoreFile').click();
    if (t.id === 'wipe') {
      if (!confirm('確定要清除所有紀錄、帳冊、旅行與設定？建議先下載備份。')) return;
      if (prompt('請輸入「刪除」確認') !== '刪除') return;
      await Promise.all(['records', 'books', 'trips', 'meta'].map(clearStore));
      S.records = []; S.books = []; S.trips = []; S.settings = structuredClone(DEFAULT_SETTINGS);
      await ensureBook(new Date().getFullYear()); render();
    }
  };
  $('#restoreFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.app !== 'mi-ledger') throw new Error('不是米記帳的備份檔'); await restoreBackup(d); }
    catch (err) { toast('還原失敗：' + err.message); }
  };
  $('#baseCur').onchange = async e => { st.baseCur = e.target.value; await saveSettings(); render(); };
}

/* ================= 新版本檢查 ================= */
/* 打開網頁時向 GitHub 取一次最新的 index.html（不走快取），版本不同就提示重新整理 */
async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const url = location.href.split('#')[0].split('?')[0];
    const txt = await (await fetch(url + '?t=' + Date.now(), {cache: 'no-store'})).text();
    const v = (txt.match(/const APP_VERSION = '([^']+)'/) || [])[1];
    if (v && v !== APP_VERSION && !$('.updbar')) {
      const bar = document.createElement('div'); bar.className = 'updbar';
      bar.innerHTML = `有新版本 ${esc(v.split('（')[0])}<button>立即更新</button>`;
      bar.querySelector('button').onclick = () => { location.replace(url + '?v=' + encodeURIComponent(v.split('（')[0]) + '&t=' + Date.now()); };
      document.body.appendChild(bar);
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

/* ================= 啟動 ================= */
load().then(() => { render(); checkUpdate(); }).catch(e => { document.body.innerHTML = `<div class="wrap"><div class="card">無法開啟資料庫：${esc(e.message)}<br>請確認沒有使用無痕模式。</div></div>`; });
</script>
